<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My 3D Model</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 18px;

            z-index: 10;
        }

    </style>

</head>


<body>

<div id="loading">
    Loading 3D model...
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import {
    GLTFLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


// ============================================
// 1. SCENE
// ============================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x050505);


// ============================================
// 2. CAMERA
// ============================================

const camera =
    new THREE.PerspectiveCamera(
        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100
    );


camera.position.set(
    0,
    1,
    5
);


// ============================================
// 3. RENDERER
// ============================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


// ============================================
// 4. LIGHTING
// ============================================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    );


scene.add(
    ambientLight
);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );


mainLight.position.set(
    5,
    8,
    5
);


mainLight.castShadow =
    true;


mainLight.shadow.mapSize.width =
    2048;


mainLight.shadow.mapSize.height =
    2048;


scene.add(
    mainLight
);


// ============================================
// 5. FLOOR
// ============================================

const floorGeometry =
    new THREE.PlaneGeometry(
        20,
        20
    );


const floorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x101010,

        roughness: 0.8,

        metalness: 0.1

    });


const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );


floor.rotation.x =
    -Math.PI / 2;


floor.position.y =
    -1;


floor.receiveShadow =
    true;


scene.add(
    floor
);


// ============================================
// 6. LOAD GLB / GLTF MODEL
// ============================================

const loader =
    new GLTFLoader();


loader.load(

    "https://threejs.org/examples/models/gltf/DamagedHelmet/glTF-Binary/DamagedHelmet.glb",


    function (gltf) {

        const model =
            gltf.scene;


        scene.add(
            model
        );


        // Make model cast shadows

        model.traverse(
            function (object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }
        );


        // Hide loading text

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        console.log(
            "3D model loaded!"
        );

    },


    function (progress) {

        console.log(
            "Loading 3D model..."
        );

    },


    function (error) {

        console.error(
            "Model failed to load:",
            error
        );

    }

);


// ============================================
// 7. TOUCH CONTROL
// ============================================

let isDragging =
    false;


let previousX = 0;

let previousY = 0;


renderer.domElement.addEventListener(
    "touchstart",

    function (event) {

        isDragging =
            true;


        previousX =
            event.touches[0].clientX;


        previousY =
            event.touches[0].clientY;

    },

    {
        passive: true
    }

);


renderer.domElement.addEventListener(
    "touchmove",

    function (event) {

        if (!isDragging)
            return;


        const currentX =
            event.touches[0].clientX;


        const currentY =
            event.touches[0].clientY;


        const movementX =
            currentX - previousX;


        const movementY =
            currentY - previousY;


        scene.traverse(
            function (object) {

                if (
                    object.isMesh
                ) {

                    object.rotation.y +=
                        movementX * 0.01;


                    object.rotation.x +=
                        movementY * 0.01;

                }

            }
        );


        previousX =
            currentX;


        previousY =
            currentY;

    },

    {
        passive: true
    }

);


renderer.domElement.addEventListener(
    "touchend",

    function () {

        isDragging =
            false;

    }

);


// ============================================
// 8. ANIMATION
// ============================================

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


// ============================================
// 9. RESPONSIVE
// ============================================

window.addEventListener(
    "resize",

    function () {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

    }

);

</script>

</body>

</html>
