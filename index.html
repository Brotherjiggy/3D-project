<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Test</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        canvas {
            display: block;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 16px;

            z-index: 10;
        }

    </style>

</head>


<body>

<div id="info">
    3D ENGINE WORKING
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ========================================
// SCENE
// ========================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x050505);


// ========================================
// CAMERA
// ========================================

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100

    );


camera.position.z = 5;


// ========================================
// RENDERER
// ========================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2

    )

);


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


document.body.appendChild(

    renderer.domElement

);


// ========================================
// 3D OBJECT
// ========================================

const geometry =
    new THREE.TorusKnotGeometry(

        1.3,

        0.4,

        128,

        32

    );


const material =
    new THREE.MeshStandardMaterial({

        color: 0xffb000,

        metalness: 0.8,

        roughness: 0.2

    });


const object =
    new THREE.Mesh(

        geometry,

        material

    );


scene.add(object);


// ========================================
// LIGHT 1
// ========================================

const light =
    new THREE.DirectionalLight(

        0xffffff,

        4

    );


light.position.set(

    3,

    4,

    5

);


scene.add(light);


// ========================================
// LIGHT 2
// ========================================

const light2 =
    new THREE.PointLight(

        0xffffff,

        20

    );


light2.position.set(

    -3,

    2,

    4

);


scene.add(light2);


// ========================================
// TOUCH CONTROL
// ========================================

let dragging = false;

let lastX = 0;

let lastY = 0;


renderer.domElement.addEventListener(

    "touchstart",

    function(event) {

        dragging = true;

        lastX =
            event.touches[0].clientX;

        lastY =
            event.touches[0].clientY;

    },

    { passive: true }

);


renderer.domElement.addEventListener(

    "touchmove",

    function(event) {

        if (!dragging)
            return;


        const x =
            event.touches[0].clientX;

        const y =
            event.touches[0].clientY;


        const dx =
            x - lastX;

        const dy =
            y - lastY;


        object.rotation.y +=
            dx * 0.01;


        object.rotation.x +=
            dy * 0.01;


        lastX = x;

        lastY = y;

    },

    { passive: true }

);


renderer.domElement.addEventListener(

    "touchend",

    function() {

        dragging = false;

    }

);


// ========================================
// ANIMATION
// ========================================

function animate() {

    requestAnimationFrame(animate);


    renderer.render(

        scene,

        camera

    );

}


animate();


// ========================================
// RESPONSIVE
// ========================================

window.addEventListener(

    "resize",

    function() {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio,

                2

            )

        );

    }

);

</script>

</body>

</html>
