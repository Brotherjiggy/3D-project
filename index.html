<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First 3D Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <script type="module">

        import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        // 1. CREATE THE 3D WORLD
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x050505);


        // 2. CREATE THE CAMERA
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.z = 5;


        // 3. CREATE THE RENDERER
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        document.body.appendChild(renderer.domElement);


        // 4. CREATE A 3D CUBE
        const geometry = new THREE.BoxGeometry(
            2,
            2,
            2
        );


        // 5. CREATE THE CUBE MATERIAL
        const material = new THREE.MeshStandardMaterial({
            color: 0xffb000,
            metalness: 0.5,
            roughness: 0.25
        });


        // 6. COMBINE GEOMETRY + MATERIAL
        const cube = new THREE.Mesh(
            geometry,
            material
        );


        // 7. PUT THE CUBE INTO THE WORLD
        scene.add(cube);


        // 8. ADD LIGHT
        const light = new THREE.DirectionalLight(
            0xffffff,
            3
        );

        light.position.set(3, 3, 5);

        scene.add(light);


        // 9. ADD AMBIENT LIGHT
        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            0.5
        );

        scene.add(ambientLight);


        // 10. TOUCH CONTROLS

let isDragging = false;

let previousX = 0;
let previousY = 0;


// Finger touches screen
renderer.domElement.addEventListener(
    "touchstart",
    (event) => {

        isDragging = true;

        previousX = event.touches[0].clientX;
        previousY = event.touches[0].clientY;

    },
    { passive: true }
);


// Finger moves
renderer.domElement.addEventListener(
    "touchmove",
    (event) => {

        if (!isDragging) return;

        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;


        const movementX =
            currentX - previousX;

        const movementY =
            currentY - previousY;


        cube.rotation.y += movementX * 0.01;

        cube.rotation.x += movementY * 0.01;


        previousX = currentX;
        previousY = currentY;

    },
    { passive: true }
);


// Finger leaves screen
renderer.domElement.addEventListener(
    "touchend",
    () => {

        isDragging = false;

    }
);


// 11. ANIMATION
function animate() {

    requestAnimationFrame(animate);

    renderer.render(
        scene,
        camera
    );
}


// 12. START
animate();


        // 11. START THE 3D WORLD
        animate();


        // 12. MAKE IT RESPONSIVE
        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio,
                        2
                    )
                );
            }
        );

    </script>

</body>
</html>
