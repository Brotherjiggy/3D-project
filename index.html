<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Realistic 3D</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020204;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

    </style>

</head>


<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ============================================
// 1. CREATE THE 3D WORLD
// ============================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020204);


// ============================================
// 2. CAMERA
// ============================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    6
);


// ============================================
// 3. HIGH-RESOLUTION RENDERER
// ============================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


// Enable shadows

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


// ============================================
// 4. CREATE THE SPHERE
// ============================================

const geometry =
    new THREE.SphereGeometry(
        1.5,
        128,
        128
    );


// ============================================
// 5. REALISTIC MATERIAL
// ============================================

const material =
    new THREE.MeshStandardMaterial({

        color: 0xffb000,

        metalness: 0.75,

        roughness: 0.2

    });


// ============================================
// 6. CREATE THE OBJECT
// ============================================

const sphere =
    new THREE.Mesh(
        geometry,
        material
    );


sphere.castShadow = true;

sphere.receiveShadow = true;


scene.add(sphere);


// ============================================
// 7. FLOOR
// ============================================

const floorGeometry =
    new THREE.PlaneGeometry(
        20,
        20
    );


const floorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x080808,

        metalness: 0.2,

        roughness: 0.7

    });


const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );


floor.rotation.x =
    -Math.PI / 2;


floor.position.y =
    -1.6;


floor.receiveShadow = true;


scene.add(floor);


// ============================================
// 8. MAIN LIGHT
// ============================================

const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );


mainLight.position.set(
    3,
    5,
    4
);


mainLight.castShadow = true;


mainLight.shadow.mapSize.width =
    2048;

mainLight.shadow.mapSize.height =
    2048;


scene.add(mainLight);


// ============================================
// 9. AMBIENT LIGHT
// ============================================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.25
    );


scene.add(
    ambientLight
);


// ============================================
// 10. SECOND LIGHT
// ============================================

const rimLight =
    new THREE.PointLight(
        0xffffff,
        20,
        10
    );


rimLight.position.set(
    -4,
    2,
    -3
);


scene.add(
    rimLight
);


// ============================================
// 11. TOUCH CONTROLS
// ============================================

let isDragging = false;

let previousX = 0;

let previousY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    (event) => {

        isDragging = true;

        previousX =
            event.touches[0].clientX;

        previousY =
            event.touches[0].clientY;

    },
    { passive: true }
);


renderer.domElement.addEventListener(
    "touchmove",
    (event) => {

        if (!isDragging) return;


        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;


        const movementX =
            currentX - previousX;

        const movementY =
            currentY - previousY;


        sphere.rotation.y +=
            movementX * 0.01;


        sphere.rotation.x +=
            movementY * 0.01;


        previousX = currentX;

        previousY = currentY;

    },
    { passive: true }
);


renderer.domElement.addEventListener(
    "touchend",
    () => {

        isDragging = false;

    }
);


// ============================================
// 12. ANIMATION
// ============================================

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


// ============================================
// 13. RESPONSIVE SCREEN
// ============================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

    }
);

</script>

</body>

</html>
